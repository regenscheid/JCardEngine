version = 1

# Project-owned configuration, build, and documentation files.
# These are not Java source and do not carry per-file SPDX comments;
# bulk-declared here per REUSE.software v3.3.
[[annotations]]
path = [
    "Makefile",
    "README.md",
    "AGENTS.md",
    ".gitattributes",
    ".gitignore",
    ".gitmodules",
    ".github/**",
    ".mvn/maven.config",
    "pom.xml",
    "**/pom.xml",
    "spotbugs.xml",
    "eclipse-formatter.xml",
    "simulator/build.xml",
    "**/*.properties",
    "**/*.yaml",
    "**/*.yml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Martin Paljak <martin@martinpaljak.net>"
SPDX-License-Identifier = "Apache-2.0"

# Maven Wrapper - vendored from the Apache Maven project (Apache-2.0).
[[annotations]]
path = [
    "mvnw",
    "mvnw.cmd",
    ".mvn/wrapper/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "The Apache Software Foundation"
SPDX-License-Identifier = "Apache-2.0"

# NIST ACVP known-answer test vectors (FIPS 203/204), trimmed to the fields
# used by the PQC KAT suite. U.S. Government work, public domain (17 U.S.C. 105).
[[annotations]]
path = [
    "simulator/src/test/resources/pqc/acvp/*.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "National Institute of Standards and Technology (NIST)"
SPDX-License-Identifier = "LicenseRef-NIST-ACVP-PublicDomain"

# org.globalplatform.* API jar - GlobalPlatform Specification License
# Agreement (see LICENSES/LicenseRef-GlobalPlatform-API.txt).
[[annotations]]
path = [
    "simulator/gpapi-globalplatform*.jar",
    "simulator/gpapi-contactless*.jar",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "GlobalPlatform Inc."
SPDX-License-Identifier = "LicenseRef-GlobalPlatform-API"
